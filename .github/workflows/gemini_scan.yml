name: gemini-scan

on:
  schedule:
    - cron: "10 0 * * *"   # UTC 00:10 = 한국시간 09:10 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼용 (테스트할 때 사용)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install pandas requests

      - name: 제미나이 규칙 스캔하고 디스코드로 보내기
        run: python gemini_scanner.py

      - name: 실패하면 디스코드로 알리기
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{"content":"🔔 [제미나이 규칙] ⚠️ 실행 실패. GitHub Actions 탭에서 gemini-scan 로그를 확인하세요."}' \
            "$DISCORD_WEBHOOK_URL"
