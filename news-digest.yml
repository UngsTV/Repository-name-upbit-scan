name: news-digest

on:
  schedule:
    - cron: "10 23 * * *"   # UTC 23:10 = 한국 08:10 (GitHub 특성상 5~20분 늦을 수 있음)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.NEWS_WEBHOOK || secrets.DISCORD_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      COINNESS_RSS: ${{ secrets.COINNESS_RSS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 웹훅 값 확인 (값은 안 보이고 길이만 출력)
        run: echo "웹훅 길이=${#DISCORD_WEBHOOK_URL}, NEWS_WEBHOOK 등록여부=${{ secrets.NEWS_WEBHOOK != '' }}"
      - run: pip install -r requirements.txt
      - run: python news_digest.py
